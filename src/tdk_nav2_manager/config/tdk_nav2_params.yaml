# nav2_params_improved.yaml
# 目的：降低機器人在牆邊卡住、貼牆抖動、MPPI 找不到可行軌跡的機率。
# 適用：ROS 2 Humble / Nav2 + MPPI + Omni motion model + mecanum drive。
# 注意：若你正在用 Cartographer / slam_toolbox 發 map->odom，不要同時啟 AMCL 發 map->odom。

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"

    # 保留你原本的 BT plugin list，避免 XML 找不到 node type。
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0

    # 小於這些速度會被視為 0。保持很小，避免低速靠牆修正被吃掉。
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # 牆邊如果 8 秒內連 5 cm 都沒動，就判定沒有進展，讓 BT 進 recovery。
      required_movement_radius: 0.05
      movement_time_allowance: 8.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # 避免最後在牆邊為了很小的誤差反覆卡住。
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.30
      stateful: True

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "Omni"

      # 預測時間 = time_steps * model_dt = 48 * 0.05 = 2.4 s。
      # 比原本 2.8 s 短一點，降低牆邊長期預測造成的高 cost。
      time_steps: 48
      model_dt: 0.05
      batch_size: 2000

      # 採樣標準差略降，降低牆邊速度抖動。
      vx_std: 0.18
      vy_std: 0.18
      wz_std: 0.35

      # 速度上限略降，讓牆邊局部避障更穩。
      vx_max:  0.25
      vx_min: -0.25
      vy_max:  0.25
      vy_min: -0.25
      wz_max:  0.70

      # 加速度限制需和 velocity_smoother 大致一致。
      ax_max: 0.6
      ax_min: -0.6
      ay_max: 0.6
      ay_min: -0.6
      az_max: 1.0

      temperature: 0.3
      gamma: 0.015

      # 原本 1.7 對 3x3 local costmap 偏大。這裡配合 4x4 local costmap 設 0.9。
      prune_distance: 0.9
      transform_tolerance: 0.3
      visualize: false

      # 如果你的 Nav2 版本啟動時說 unknown parameter，可以先註解掉 retry_attempt_limit / open_loop。
      retry_attempt_limit: 3
      open_loop: false

      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic",
        "PathAngleCritic", "PreferForwardCritic"
      ]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      # 最關鍵修正：near_collision_cost 不要設成 100。
      # 100 會讓很多 inflation 區域被視為過於危險，牆邊容易找不到可行軌跡。
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_collision_cost: 253
        near_goal_distance: 0.5
        trajectory_point_step: 2

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.0

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

      # 麥克納姆輪不需要偏好前進，避免能橫移卻被迫轉正。
      PreferForwardCritic:
        enabled: false
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

      # 原本 cost_weight 14 + offset 20 對牆邊可能太強，會硬貼 global path。
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        max_path_occupancy_ratio: 0.10
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 8

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.0

      # 對 omni/mecanum，路徑方向懲罰不宜太重，否則牆邊容易又想轉正又想避障。
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.5
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0

planner_server:
  ros__parameters:
    use_sim_time: True

    # 注意：這不是 BT 重新規劃頻率，只是 planner server 的期望執行頻率 warning 門檻。
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.20
      downsample_costmap: false
      downsampling_factor: 1

      # 若你的地圖邊界或未知區域很多，牆邊路徑常被封死，可改 true 測試。
      allow_unknown: false

      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0

      # 稍微提高，讓 global planner 不要太貼牆，但不要過高，避免狹窄通道無法通過。
      cost_travel_multiplier: 2.5
      use_final_approach_orientation: true

      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    use_sim_time: True
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait

    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"

    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.7
    min_rotational_vel: 0.15
    rotational_acc_lim: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true

      # 原本 3x3 偏緊，MPPI horizon + prune_distance 容易看到 costmap 邊界。
      width: 4
      height: 4
      resolution: 0.05

      # 45 cm x 45 cm 方形車體。前提：base_footprint 必須在車體幾何中心。
      footprint: "[[-0.225, -0.225], [-0.225, 0.225], [0.225, 0.225], [0.225, -0.225]]"
      footprint_padding: 0.01

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      # 降低牆邊過度保守。若仍貼牆，再把 inflation_radius 增到 0.40。
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        inflation_radius: 0.35
        cost_scaling_factor: 7.0

      always_send_full_costmap: True


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint

      footprint: "[[-0.225, -0.225], [-0.225, 0.225], [0.225, 0.225], [0.225, -0.225]]"
      footprint_padding: 0.01
      resolution: 0.05
      track_unknown_space: true

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      # 原本 0.70 對 45 cm 車體偏保守，容易讓牆邊整片高 cost。
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        inflation_radius: 0.50
        cost_scaling_factor: 5.0

      always_send_full_costmap: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: false

    # OPEN_LOOP：用上一筆 command 估目前速度；模擬常用，實車若 odom 準可改 CLOSED_LOOP。
    feedback: "OPEN_LOOP"

    # [X, Y, Theta]。麥克納姆輪要保留 Y，不要設 0。
    max_velocity: [0.25, 0.25, 0.70]
    min_velocity: [-0.25, -0.25, -0.70]
    max_accel: [0.6, 0.6, 1.0]
    max_decel: [-0.6, -0.6, -1.0]

    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: True
    autostart: True
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
