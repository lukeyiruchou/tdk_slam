    # 重規劃頻率由 BT XML 內的 RateController 決定(若已改用 0.5hz 自訂版,路徑填在這)
    default_bt_xml_filename: "navigate_w_replanning_and_recovery.xml"

    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node

# Controller：MPPI（Omni）
controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 10.0

    # 允許 1 秒內的瞬時控制失敗自行恢復,避免 micro-ROS TF 抖動觸發 recovery 停頓
    failure_tolerance: 1.0

    # 低於此閾值的速度視為 0。麥輪要保留 y！不可設 0。
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.03           # 3 cm,精準停靠
      yaw_goal_tolerance: 0.05          # ~2.85°
      stateful: True                    # xy 達標後只檢查 yaw

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      motion_model: "Omni"

      time_steps: 20                    # 0.1*20 = 2.0s 視野
      model_dt: 0.1                     # = 1/controller_frequency
      batch_size: 1000

      # --- 取樣標準差 ---
      # ★v3:速度×3,std 等比放大維持相同比例(慢速版已驗證此比例不震盪)。
      #   wz_std 是原地旋轉能力的關鍵:太低會取樣不到純旋轉軌跡,
      #   機器人就只會用小弧線前後嚕來調頭。官方參考值即為 0.4。
      vx_std: 0.15
      vy_std: 0.15
      wz_std: 0.4

      # --- 速度上限(★v3:×3,與 velocity_smoother 對齊)---
      vx_max:  0.39
      vx_min: -0.39
      vy_max:  0.36
      vy_min: -0.36
      wz_max:  1.35

      # --- 加速度上限(★v3:×3,與 velocity_smoother 對齊。az 放寬讓旋轉能在
      #     2 秒視野內轉出足夠角度,旋轉軌跡評分才佔得到便宜)---
      ax_max: 0.45
      ax_min: -0.45
      ay_max: 0.45
      ay_min: -0.45
      az_max: 1.5

      temperature: 0.3
      gamma: 0.015

      # ★v3:0.4→1.0。視野距離變成 0.39*2.0 ≈ 0.78m,prune 必須 >= 視野+餘裕
      prune_distance: 1.0
      transform_tolerance: 0.5          # 容忍 micro-ROS /odom 的 TF 抖動
      visualize: false

      retry_attempt_limit: 3
      regenerate_noises: true

      critics: [
        "ConstraintCritic", "CostCritic", "GoalCritic",
        "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic"
      ]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_collision_cost: 253
        near_goal_distance: 0.5
        trajectory_point_step: 2

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        threshold_to_consider: 1.0

      # ★v3:權重 3.0→5.0、範圍 0.40→0.50。
      #   終點對正車頭全靠這個 critic,權重太低時「小弧線順便轉一點」
      #   的成本會比純旋轉低,就變成幾十次路邊停車式調頭。
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.50

      # 麥輪沒有「正面」概念,禁用前進偏好,才能自由橫移/斜走。
      PreferForwardCritic:
        enabled: false
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        max_path_occupancy_ratio: 0.10
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 8

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.0

      # 維持關閉:前後嚕只發生在終點段,沿路平移行為不需要車頭跟隨。
      PathAngleCritic:
        enabled: false
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 1

# Planner：Smac 2D（全向,不考慮車頭,適合麥輪）
planner_server:
  ros__parameters:
    use_sim_time: False
    expected_planner_frequency: 0.5

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.20
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false

      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["simple_smoother"]

    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

# Behavior（recovery 動作）
behavior_server:
  ros__parameters:
    use_sim_time: False
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
      - spin
      - backup
      - drive_on_heading
      - wait

    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"

    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0             # ★v3:recovery 旋轉跟著提速(不必到 1.35)
    min_rotational_vel: 0.10
    rotational_acc_lim: 1.5             # ★v3:與 az_max 對齊

# Local Costmap（滾動視窗）
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 3.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true

      # 3x3m:MPPI 視野 0.78m + prune 1.0m,3m 視窗仍足夠(半徑 1.5m)
      width: 3
      height: 3
      resolution: 0.05

      footprint: "[[-0.225, -0.225], [-0.225, 0.225], [0.225, 0.225], [0.225, -0.225]]"
      footprint_padding: 0.01

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 2.5
          raytrace_min_range: 0.0
          obstacle_max_range: 2.0
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        inflation_radius: 0.30
        cost_scaling_factor: 5.0

      always_send_full_costmap: True

# Global Costmap
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: False
      update_frequency: 0.5
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_footprint

      footprint: "[[-0.225, -0.225], [-0.225, 0.225], [0.225, 0.225], [0.225, -0.225]]"
      footprint_padding: 0.01
      resolution: 0.05
      track_unknown_space: true

      plugins:
        - static_layer
        - obstacle_layer
        - inflation_layer

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        inflation_radius: 0.45
        cost_scaling_factor: 4.0

      always_send_full_costmap: True

# Waypoint Follower
waypoint_follower:
  ros__parameters:
    use_sim_time: False
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

# Velocity Smoother（★ 全檔唯一一個,數值已與 MPPI 對齊）
velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: false

    feedback: "OPEN_LOOP"

    # [X, Y, Theta] ★v3:×3,與 MPPI 新上限完全對齊。麥輪務必保留 Y!
    max_velocity: [0.39, 0.36, 1.35]
    min_velocity: [-0.39, -0.36, -1.35]
    max_accel: [0.45, 0.45, 1.5]
    max_decel: [-0.45, -0.45, -1.5]

    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# Lifecycle Manager
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: False
    autostart: True
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother